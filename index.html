</style></head><body><div id="top"><header>🏢 ساختمان من</header><nav></nav></div><main id="main"></main>

<footer id="ver">ساختمان من • نسخه ۱.۶.۰</footer><div id="sh"></div><div id="cal"></div><input type="file" id="fr" hidden>
<script>
const $=s=>document.querySelector(s),v=i=>$('#'+i).value;
const FD='۰۱۲۳۴۵۶۷۸۹',nd=s=>String(s).replace(/[۰-۹]/g,d=>FD.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const fa=n=>String(n).replace(/\d/g,d=>FD[d]),money=n=>fa(Math.round(n).toLocaleString('en'))+' ریال';
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function g2j(gy,gm,gd){var g=[0,31,59,90,120,151,181,212,243,273,304,334],jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;var g2=(gm>2)?(gy+1):gy,days=(365*gy)+parseInt((g2+3)/4)-parseInt((g2+99)/100)+parseInt((g2+399)/400)-80+gd+g[gm-1];jy+=33*parseInt(days/12053);days%=12053;jy+=4*parseInt(days/1461);days%=1461;if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365}var jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30),jd=1+((days<186)?(days%31):((days-186)%30));return[jy,jm,jd]}
function j2g(jy,jm,jd){var gy=(jy<=979)?621:1600;jy-=(jy<=979)?0:979;var days=(365*jy)+(parseInt(jy/33)*8)+parseInt(((jy%33)+3)/4)+78+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);gy+=400*parseInt(days/146097);days%=146097;if(days>36524){gy+=100*parseInt(--days/36524);days%=36524;if(days>=365)days++}gy+=4*parseInt(days/1461);days%=1461;if(days>365){gy+=parseInt((days-1)/365);days=(days-1)%365}var gd=days+1,s=[0,31,((gy%4==0&&gy%100!=0)||(gy%400==0))?29:28,31,30,31,30,31,31,30,31,30,31],gm;for(gm=0;gm<13;gm++){var x=s[gm];if(gd<=x)break;gd-=x}return[gy,gm,gd]}
const ser=(y,m,d)=>{const g=j2g(y,m,d);return Math.floor(Date.UTC(g[0],g[1]-1,g[2])/864e5)};
const sj=n=>{const x=new Date(n*864e5);return g2j(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate())};
const p2=n=>String(n).padStart(2,'0'),dl_=n=>{const j=sj(n);return j[0]+'/'+p2(j[1])+'/'+p2(j[2])},ds=n=>fa(dl_(n));
function D(s){if(!s)return null;const p=nd(s).trim().split(/[\/\-.]/).map(Number);if(p.length!=3||p.some(isNaN)||p[1]<1||p[1]>12||p[2]<1||p[2]>31)return null;return ser(p[0],p[1],p[2])}
const mlen=(y,m)=>m<7?31:m<12?30:ser(y+1,1,1)-ser(y,12,1);
const now=new Date(),T=g2j(now.getFullYear(),now.getMonth()+1,now.getDate()),ts=ser(...T),tstr=dl_(ts);
const blank=()=>({units:[],charges:[],pct:50,exp:[],pay:[],seq:1});
let db;try{db=JSON.parse(localStorage.getItem('smn'))||blank()}catch(x){db=blank()}
const nz=()=>{db.cfg=Object.assign({s:null,c:0,b:0,w:0,g:0,pp:0,ar:0,ht:0},db.cfg);db.deb=db.deb||[];db.grp=db.grp||[]};nz();
const save=()=>{try{localStorage.setItem('smn',JSON.stringify(db))}catch(x){alert('حافظه برنامه پر است! همین حالا بکاپ بگیرید و چند تصویر قدیمی را حذف کنید.')}},nid=()=>db.seq++;
function mig(){if(db.fx)return;const f=n=>{if(!n)return n;const j=sj(n);return j[0]<1000?ser(j[0]+979,j[1],j[2]):n};
db.units.forEach(u=>{[u.own,u.res].forEach(o=>{o.s=f(o.s);o.e=f(o.e)});u.vac=u.vac.map(q=>[f(q[0]),f(q[1])])});
db.charges.forEach(c=>{c.from=f(c.from);c.to=f(c.to)});db.exp.forEach(x=>x.d=f(x.d));db.pay.forEach(x=>x.d=f(x.d));db.fx=1;save()}
mig();
const nm=u=>u.res.n||u.own.n||'—',chargeAt=s=>{let b=null;db.charges.forEach(c=>{if(c.from<=s&&(!c.to||s<=c.to)&&(!b||c.from>=b.from))b=c});return b};
function ledger(u){const R=[],o=u.res,first=db.charges.length?Math.min(...db.charges.map(c=>c.from)):null;
if(first!=null){const st=(u.old||!o.s)?first:o.s,en=o.e||1e9;let[y,m]=sj(first);
while(y<T[0]||(y==T[0]&&m<=T[1])){const L=mlen(y,m),m1=ser(y,m,1);let a=0;
let fd=null;for(let d=0;d<L;d++){const x=m1+d,c=chargeAt(x);if(!c||c.mo=='n'||(c.mo=='t'&&x<ts))continue;if(fd==null)fd=x;const r=c.amt/L;
if(u.vac.some(q=>x>=q[0]&&(!q[1]||x<=q[1])))a+=r*db.pct/100;else if(x>=st&&x<=en)a+=r}
if(a>0)R.push({d:fd,deb:Math.round(a),t:'شارژ ماه '+MN[m-1]+' '+fa(y)});if(++m>12){m=1;y++}}}
db.exp.forEach(x=>{if(x.sc=='u'&&x.us.includes(u.id))R.push({d:x.d,deb:x.sh?x.sh[u.id]:Math.round(x.amt/x.us.length),t:x.ty+(x.dt?': '+x.dt[u.id]:x.t?' - '+x.t:'')})});db.deb.forEach(x=>{if(x.u==u.id)R.push({d:x.d,deb:x.amt,t:x.t||'بدهکاری'})});
db.pay.forEach(p=>{if(p.u==u.id)R.push({d:p.d,cr:p.amt,t:'واریز '+(p.m=='c'?'نقدی':'کارتی/بانکی')+(p.t?' - '+p.t:'')})});
return R.sort((a,b)=>a.d-b.d)}
function bal(u){const R=ledger(u);let deb=0,cr=0;R.forEach(r=>{deb+=r.deb||0;cr+=r.cr||0});let left=cr,age=0;
for(const r of R.filter(r=>r.deb)){if(left>=r.deb)left-=r.deb;else{age=ts-r.d;break}}return{R,deb,cr,b:deb-cr,age}}
const eff=m=>db.pay.filter(p=>p.m==m&&!p.h).reduce((s,p)=>s+p.amt,0)-db.exp.filter(x=>x.m==m&&!x.h).reduce((s,x)=>s+x.amt,0),bs=m=>(m=='c'?db.cfg.c:db.cfg.b)+eff(m);
let tab='h',sub='e';
function go(t){tab=t;render()}
function sheet(h){$('#sh').innerHTML='<div class="bk" onclick="cl()"></div><div class="bx">'+h+'</div>';$('#sh').style.display='block';hk()}
function cl(){$('#sh').style.display='none'}
const nf=n=>fa(String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'٬'));
const KF=()=>`<div class="card" style="background:#fff7e0;color:#5c4400;border-color:#f0d58a"><b>⚠️ توجه</b><small style="color:inherit">موجودی نقدی و بانکی را به‌روز (امروز) وارد کنید. اسناد مالی قبل از این موجودی را حتماً با گزینه «ثبت فقط در تاریخچه» وارد کنید تا روی این موجودی اثر نگذارند.</small></div><label>موجودی نقدی دفتر ساختمان (ریال)</label><input id="k_c" type="tel" value="${nf(bs('c'))}"><label>موجودی حساب بانکی (ریال)</label><input id="k_b" type="tel" value="${nf(bs('b'))}">`;
const bi=()=>`<label>تعداد واحدها</label><input id="k_n" type="tel" value="${db.units.length?fa(db.units.length):''}">`+KF()+`<button onclick="kv()">ذخیره اطلاعات ساختمان</button>`;
function kv(){const n=parseInt(nd(v('k_n'))),pn=x=>parseFloat(nd(v(x)).replace(/[,٬]/g,''))||0;
if(!(n>0&&n<500))return alert('تعداد واحدها را درست وارد کنید');
const used=u=>db.pay.some(p=>p.u==u.id)||db.exp.some(x=>(x.us||[]).includes(u.id))||db.deb.some(x=>x.u==u.id);
for(let i=db.units.length-1;i>=n;i--)if(used(db.units[i]))return alert('واحد '+fa(db.units[i].no)+' سند دارد و حذف نمی‌شود');
while(db.units.length>n)db.units.pop();while(db.units.length<n)db.units.push(nu(db.units.length+1));
const nc=pn('k_c'),nb=pn('k_b');if((nc!=bs('c')||nb!=bs('b'))&&!confirm('موجودی نقدی و بانکی به‌روز ثبت می‌شود.\n\nدقت کنید: اسناد مالی قبل از این موجودی را فقط با گزینه «ثبت فقط در تاریخچه» وارد کنید تا روی این مبلغ اثر نگذارند.\n\nادامه می‌دهید؟'))return;db.cfg.c=nc-eff('c');db.cfg.b=nb-eff('b');save();render()}
function tg(){return `<h3>تب‌های اضافی</h3><label class="ck"><input type="checkbox" ${db.cfg.w?'checked':''} onchange="db.cfg.w=this.checked?1:0;save();render()"> فعال‌سازی تب قبض آب</label><label class="ck"><input type="checkbox" ${db.cfg.g?'checked':''} onchange="db.cfg.g=this.checked?1:0;save();render()"> فعال‌سازی تب قبض گاز</label>`+(db.cfg.g?`<h3>گروه‌بندی واحدها (قبض گاز)</h3>`+db.grp.map(g=>`<div class="card it"><span>${e(g.n)}<small>${fa(Math.abs(g.p))}٪ ${g.p<0?'کمتر':'بیشتر'} | ${fa(g.us.length)} واحد ${e(g.t||'')}</small></span><button class="x" onclick="db.grp=db.grp.filter(x=>x.id!=${g.id});save();render()">✕</button></div>`).join('')+`<button class="s" onclick="gf()">+ گروه جدید</button>`:'')}
function gf(){sheet(`<h3>گروه جدید</h3><label>نام گروه (مثلاً واحدهای جنوبی)</label><input id="gn"><label>توضیحات</label><input id="gt"><label>سهم این گروه نسبت به حالت عادی</label><div class="row"><select id="gd"><option value="-1">کمتر</option><option value="1">بیشتر</option></select><input id="gp" type="tel" placeholder="درصد مثلاً ۱۰"></div><label>واحدهای گروه</label>${db.units.map(u=>`<label class="ck"><input type="checkbox" value="${u.id}"> واحد ${fa(u.no)} - ${e(nm(u))}</label>`).join('')}<button onclick="gs()">ثبت</button>`)}
function gs(){const p=parseFloat(nd(v('gp'))),us=[...document.querySelectorAll('#sh input[type=checkbox]:checked')].map(x=>+x.value);if(!v('gn')||!(p>0)||!us.length)return alert('نام، درصد و واحدها را وارد کنید');db.grp.push({id:nid(),n:v('gn'),t:v('gt'),p:p*v('gd'),us});save();cl();render()}
function hk(){['os','oe','rs','re','vs','ve','d','d2','k_s'].forEach(i=>{const x=$('#'+i);if(x){x.readOnly=true;x.onclick=()=>cal(i)}});['a','k_c','k_b'].forEach(i=>{const x=$('#'+i);if(x){x.oninput=()=>fm(x);if(i=='a')x.placeholder='مثلاً ۳٬۵۰۰٬۰۰۰'}})}
function render(){const m=$('#main');
if(!db.units.length){m.innerHTML='<h3>شروع</h3>'+bi();$('nav').innerHTML='';hk();return}
if((tab=='w'&&!db.cfg.w)||(tab=='g'&&!db.cfg.g))tab='s';
$('nav').innerHTML=[['h','خانه','🏠'],['u','واحدها','🏢'],['f','مالی','💰']].concat(db.cfg.w?[['w','قبض آب','💧']]:[],db.cfg.g?[['g','قبض گاز','🔥']]:[],[['s','تنظیمات','⚙️']]).map(x=>`<button data-t="${x[0]}" class="${x[0]==tab?'on':''}" onclick="go('${x[0]}')"><i>${x[2]}</i>${x[1]}</button>`).join('');
m.innerHTML={h:home,u:units,f:fin,s:sett,w:()=>bills('w'),g:()=>bills('g')}[tab]();hk()}
const nu=no=>({id:nid(),no,tn:0,old:0,own:{},res:{},vac:[]});
function home(){const L=db.units.map(u=>({u,...bal(u)})).filter(x=>x.b>0&&x.age>30).sort((a,b)=>b.b-a.b||b.age-a.age);
return `<div class="hero"><small>موجودی کل دفتر ساختمان</small><b>${money(bs('c')+bs('b'))}</b></div><div class="row"><div class="card cash"><small>💵 نقدی</small><b>${money(bs('c'))}</b></div><div class="card bank"><small>🏦 حساب بانکی</small><b>${money(bs('b'))}</b></div></div><h3>بدهکاران (بیش از ۳۰ روز)</h3>`+(L.length?L.map(x=>`<div class="card it" onclick="ud(${x.u.id})"><span>واحد ${fa(x.u.no)} - ${e(nm(x.u))}<small>${fa(x.age)} روز</small></span><b class="neg">${money(x.b)}</b></div>`).join(''):'<p class="m">بدهکاری وجود ندارد</p>')}
function units(){return `<button class="s" onclick="sum()">خلاصه بدهکاری همه واحدها</button>`+db.units.map(u=>{const b=bal(u).b;return `<div class="card it" onclick="ud(${u.id})"><span class="rw"><i class="av">${fa(u.no)}</i><span>${e(nm(u))}${u.tn?'<small>مستاجر</small>':'<small>واحد '+fa(u.no)+'</small>'}</span></span><b class="${b>0?'neg':'pos'}">${b>0?'بدهکار: ':'تسویه/بستانکار: '}${money(Math.abs(b))}</b></div>`}).join('')}
function sum(){let t=0;const L=db.units.map(u=>({u,b:bal(u).b})).filter(x=>x.b>0);L.forEach(x=>t+=x.b);sheet(`<h3>خلاصه بدهکاری تا ${fa(tstr)}</h3><table>${L.map(x=>`<tr><td>واحد ${fa(x.u.no)} - ${e(nm(x.u))}</td><td class="neg">${money(x.b)}</td></tr>`).join('')}<tr><th>جمع</th><th>${money(t)}</th></tr></table>`)}
function ud(i){const u=db.units.find(x=>x.id==i),b=bal(u);sheet(`<h3>واحد ${fa(u.no)} - ${e(nm(u))}</h3><p class="${b.b>0?'neg':'pos'}">مانده: ${money(b.b)} ${b.b>0?'(بدهکار)':'(بستانکار)'}</p><div style="overflow:auto"><table><tr><th>تاریخ</th><th>شرح</th><th>بدهکار</th><th>بستانکار</th></tr>${b.R.map(r=>`<tr><td>${ds(r.d)}</td><td>${e(r.t)}</td><td class="neg">${r.deb?fa(r.deb.toLocaleString('en')):''}</td><td class="pos">${r.cr?fa(r.cr.toLocaleString('en')):''}</td></tr>`).join('')}<tr><th colspan="2">جمع</th><th>${fa(b.deb.toLocaleString('en'))}</th><th>${fa(b.cr.toLocaleString('en'))}</th></tr></table></div><div class="row"><button onclick="sms(${i})">ارسال پیامک</button><button class="s" onclick="uf(${i})">ویرایش</button></div>`)}
function sms(i){const u=db.units.find(x=>x.id==i),b=bal(u).b,ph=u.res.p||u.own.p||'';location.href='sms:'+ph+'?body='+encodeURIComponent(`سلام\nصورتحساب واحد ${fa(u.no)}:\nتا تاریخ: ${fa(tstr)}\nمبلغ: ${money(b)}\nمی‌باشد`)}
let tv=[];
function pf(p,o,a,b){return `<label>نام</label><input id="${p}n" value="${e(o.n)}"><label>تلفن همراه</label><div class="row"><input id="${p}p" type="tel" value="${e(o.p)}"><button class="s" onclick="ct('${p}p')">دفترچه</button></div><details><summary>تاریخ‌ها (شمسی)</summary><label>${a}</label><input id="${p}s" placeholder="۱۴۰۵/۰۱/۰۱" value="${o.s?ds(o.s):''}"><label>${b}</label><input id="${p}e" placeholder="۱۴۰۵/۱۲/۲۹" value="${o.e?ds(o.e):''}"></details>`}
function uf(i){const u=db.units.find(x=>x.id==i);tv=u.vac.map(x=>[...x]);
sheet(`<h3>واحد ${fa(u.no)}</h3><label class="ck"><input type="checkbox" id="tn" ${u.tn?'checked':''} onchange="$('#ow').style.display=this.checked?'block':'none'"> مستاجر است (مالک و ساکن متفاوت)</label><div id="ow" style="display:${u.tn?'block':'none'}"><h3>مالک</h3>${pf('o',u.own,'شروع مالکیت','پایان مالکیت')}</div><h3>ساکن</h3>${pf('r',u.res,'شروع سکونت','پایان سکونت')}${db.cfg.pp?`<label>تعداد نفرات خانوار</label><input id="up" type="tel" value="${u.ppl||''}">`:''}${db.cfg.ar?`<label>متراژ واحد</label><input id="ua" type="tel" value="${u.area||''}">`:''}${db.cfg.ht?`<label>تعداد وسایل گرمایش</label><input id="uh" type="tel" value="${u.htr||''}">`:''}<label class="ck"><input type="checkbox" id="ol" ${u.old?'checked':''}> سکونت از قدیم</label><details><summary>واحد خالی</summary><div id="vl"></div><div class="row"><input id="vs" placeholder="از تاریخ"><input id="ve" placeholder="تا تاریخ"><button class="s" onclick="va()">+</button></div></details><button onclick="us(${i})">ذخیره</button>`);vr()}
function vr(){$('#vl').innerHTML=tv.map((q,k)=>`<div class="row"><span>${ds(q[0])} تا ${q[1]?ds(q[1]):'ادامه دارد'}</span><button class="x" onclick="tv.splice(${k},1);vr()">✕</button></div>`).join('')}
function va(){const s=D(v('vs'));if(!s)return alert('تاریخ شروع نامعتبر');tv.push([s,D(v('ve'))]);$('#vs').value=$('#ve').value='';vr()}
function us(i){const u=db.units.find(x=>x.id==i),g=p=>({n:v(p+'n'),p:nd(v(p+'p')),s:D(v(p+'s')),e:D(v(p+'e'))});
Object.assign(u,{tn:$('#tn').checked?1:0,old:$('#ol').checked?1:0,own:g('o'),res:g('r'),vac:tv},$('#up')?{ppl:+nd(v('up'))||0}:{},$('#ua')?{area:parseFloat(nd(v('ua')))||0}:{},$('#uh')?{htr:+nd(v('uh'))||0}:{});save();cl();render()}
async function ct(i){try{const r=await navigator.contacts.select(['tel'],{multiple:false});if(r[0]&&r[0].tel[0])$('#'+i).value=r[0].tel[0].replace(/\s/g,'')}catch(x){alert('این دستگاه/مرورگر دسترسی به دفترچه تلفن را پشتیبانی نمی‌کند. شماره را دستی وارد کنید.')}}
function itm(x,E){const u=db.units.find(y=>y.id==x.u);return `<div class="card it"><span>${E?e(x.ty):'واحد '+fa(u?u.no:'?')}<small>${ds(x.d)} | ${E?(x.sc=='u'?'متعلق به '+fa(x.us.length)+' واحد':'دفتر ساختمان'):''} ${x.m=='c'?'نقدی':'بانکی'} ${e(x.t||'')}${x.h?' | 🕘 فقط تاریخچه':''}</small></span><span><b>${money(x.amt)}</b></span>${x.img?`<button class="x" onclick="vimg(${x.id})">🖼</button>`:''}<button class="x" onclick="dh('${E?'exp':'pay'}',${x.id})">✕</button></div>`}
function fin(){const E=sub=='e',A=E?db.exp:db.pay,tot=A.reduce((s,x)=>s+x.amt,0);
return `<div class="tabs"><button class="${E?'':'s'}" onclick="sub='e';render()">هزینه‌های ساختمان</button><button class="${E?'s':''}" onclick="sub='p';render()">واریزی‌ها</button></div><div class="hero"><small>${E?'جمع هزینه‌ها':'جمع واریزی‌ها'}</small><b>${money(tot)}</b></div><button class="big" onclick="${E?'ef()':'pf2()'}">+ ثبت ${E?'هزینه':'واریزی'} جدید</button><button class="s big" onclick="hist()">🕘 تاریخچه (${fa(A.length)} مورد)</button>`}
function hist(){const E=sub=='e',L=(E?db.exp:db.pay).slice().sort((a,b)=>b.d-a.d);sheet(`<h3>تاریخچه ${E?'هزینه‌های ساختمان':'واریزی‌ها'}</h3>`+(L.length?L.map(x=>itm(x,E)).join(''):'<p class="m">موردی ثبت نشده است</p>'))}
function dh(k,i){if(confirm('حذف شود؟')){db[k]=db[k].filter(x=>x.id!=i);save();render();hist()}}
function del(k,i){if(confirm('حذف شود؟')){db[k]=db[k].filter(x=>x.id!=i);save();render()}}
function ef(){sheet(`<h3>هزینه جدید</h3><label>مبلغ (ریال)</label><input id="a" type="tel"><label>نوع هزینه</label><input id="ty" list="tl"><datalist id="tl">${['نظافت ساختمان','قبض آب','قبض برق','قبض گاز','آسانسور','تعمیرات','سایر'].map(x=>`<option>${x}</option>`).join('')}</datalist><label>تاریخ (می‌توان تاریخ گذشته وارد کرد)</label><input id="d" value="${fa(tstr)}"><label>توضیحات</label><input id="t"><label>پرداخت از</label><select id="m"><option value="c">نقدی</option><option value="b">حساب بانکی</option></select><label>محل هزینه‌کرد</label><select id="sc" onchange="$('#ul').style.display=this.value=='u'?'block':'none'"><option value="o">دفتر ساختمان</option><option value="u">متعلق به واحدها</option></select><div id="ul" style="display:none">${db.units.map(u=>`<label class="ck"><input type="checkbox" value="${u.id}"> واحد ${fa(u.no)} - ${e(nm(u))}</label>`).join('')}</div><label class="ck"><input type="checkbox" id="hh"> ثبت فقط در تاریخچه (روی موجودی دفتر اثر نگذارد)</label><button onclick="es()">ثبت</button>`)}
function es(){const amt=parseFloat(nd(v('a')).replace(/[,٬]/g,'')),d=D(v('d')),sc=v('sc'),us=[...document.querySelectorAll('#ul input:checked')].map(x=>+x.value);
if(!(amt>0)||!d||!v('ty'))return alert('مبلغ، نوع و تاریخ را درست وارد کنید');if(sc=='u'&&!us.length)return alert('حداقل یک واحد را تیک بزنید');
db.exp.push({id:nid(),amt,ty:v('ty'),d,t:v('t'),m:v('m'),sc,us:sc=='u'?us:[],h:$('#hh').checked?1:0});save();cl();render()}
function pf2(){pim='';sheet(`<h3>واریزی جدید</h3><label>واحد</label><select id="u">${db.units.map(u=>`<option value="${u.id}">واحد ${fa(u.no)} - ${e(nm(u))}</option>`).join('')}</select><label>مبلغ (ریال)</label><input id="a" type="tel"><label>تاریخ (می‌توان تاریخ گذشته وارد کرد)</label><input id="d" value="${fa(tstr)}"><label>نوع واریز</label><select id="m"><option value="c">نقدی</option><option value="b">کارتی / بانکی</option></select><label>توضیحات</label><input id="t"><label>تصویر سند (اختیاری)</label><input id="im" type="file" accept="image/*" onchange="pimg(this)"><img id="pv" style="display:none;width:100%;max-height:200px;object-fit:contain;margin-top:6px;border-radius:10px"><small id="pz"></small><label class="ck"><input type="checkbox" id="hh"> ثبت فقط در تاریخچه (روی موجودی دفتر اثر نگذارد)</label><button onclick="ps()">ثبت</button>`)}
function ps(){const amt=parseFloat(nd(v('a')).replace(/[,٬]/g,'')),d=D(v('d'));if(!(amt>0)||!d)return alert('مبلغ و تاریخ را درست وارد کنید');
db.pay.push({id:nid(),u:+v('u'),amt,d,m:v('m'),t:v('t'),img:pim,h:$('#hh').checked?1:0});pim='';save();cl();render()}

function bills(k){const L=db.exp.filter(x=>x.k==k).sort((a,b)=>b.d-a.d);return `<button onclick="bf('${k}')">+ ${BK[k]} جدید</button>`+L.map(x=>`<div class="card it" onclick="bd(${x.id})"><span>${ds(x.d)}<small>${e(x.t||'')}</small></span><b>${money(x.amt)}</b><button class="x" onclick="event.stopPropagation();del('exp',${x.id})">✕</button></div>`).join('')}
function bd(i){const x=db.exp.find(y=>y.id==i);sheet(`<h3>${x.ty} - ${ds(x.d)}</h3><p>${money(x.amt)}</p><table>${Object.keys(x.sh).map(k=>{const u=db.units.find(z=>z.id==k);return `<tr><td>واحد ${u?fa(u.no):'?'}</td><td>${money(x.sh[k])}</td><td><small>${e(x.dt[k])}</small></td></tr>`}).join('')}<tr><td>عمومی</td><td>${money(x.pub||0)}</td><td></td></tr></table>`)}
function bf(k){const G=k=='g',M=[['p','تعداد نفرات خانوار'],['u','متراژ مصرفی هر واحد (متر مکعب)'],['n','تعداد واحدها (مساوی)']].concat(G?[['a','متراژ واحد'],['h','تعداد وسایل گرمایش']]:[]);
sheet(`<h3>${BK[k]} جدید</h3><label>مبلغ کل قبض (ریال)</label><input id="a" type="tel"><label>مصرف کل در قبض (متر مکعب)</label><input id="mm" type="tel"><label>تاریخ</label><input id="d" value="${fa(tstr)}"><label>توضیحات (مثلاً دوره قبض)</label><input id="t"><label>پرداخت از</label><select id="m"><option value="c">نقدی</option><option value="b">حساب بانکی</option></select><label>روش محاسبه (فقط یکی)</label><select id="md" onchange="mc(this.value)"><option value="">انتخاب کنید</option>${M.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>${G&&db.grp.length?'<label class="ck"><input type="checkbox" id="ug"> تفاوت بین واحدها (اعمال گروه‌ها)</label>':''}<label class="ck"><input type="checkbox" id="hh"> ثبت فقط در تاریخچه (روی موجودی دفتر اثر نگذارد)</label><button onclick="b2('${k}')">ادامه</button>`)}
function mc(x){const f={p:['pp','نفرات خانوار'],a:['ar','متراژ واحد'],h:['ht','تعداد وسایل گرمایش']}[x];if(f){db.cfg[f[0]]=1;save();alert('این روش نیاز دارد که «'+f[1]+'» هر واحد را در تب واحدها (ویرایش هر واحد) وارد کنید. اگر هنوز وارد نکرده‌اید، اول آن را وارد کنید و بعد قبض را ثبت کنید.')}}
const MK={p:'ppl',a:'area',h:'htr'};
function b2(k){const amt=parseFloat(nd(v('a')).replace(/[,٬]/g,'')),d=D(v('d')),md=v('md');if(!(amt>0)||!d||!md)return alert('مبلغ، تاریخ و روش محاسبه را مشخص کنید');

bl={k,amt,d,md,t:v('t'),m:v('m'),h:$('#hh').checked?1:0,ug:!!($('#ug')&&$('#ug').checked)};
const lab={p:'نفر',u:'متر مکعب',n:'سهم',a:'متر',h:'وسیله'}[md];
const row=(id,l,n)=>`<tr><td>${l}</td><td>${md=='n'?'۱':(md=='u'||id=='p'?`<input id="x${id}" type="tel" value="${n||''}" style="width:70px" oninput="rc()">`:fa(n||0))}</td><td id="r${id}"></td></tr>`;
sheet(`<h3>${BK[k]} - تایید سهم واحدها</h3><small>${md=='u'?'مصرف هر واحد را وارد کنید. ':''}ردیف «عمومی» مصرف عمومی ساختمان (شست‌وشو، باغچه) است و به واحدها بدهکار نمی‌شود.</small><table><tr><th>واحد</th><th>${lab}</th><th>مبلغ</th></tr>${db.units.map(u=>row(u.id,'واحد '+fa(u.no),MK[md]?u[MK[md]]:0)).join('')}${row('p','عمومی',0)}</table><p id="rt" class="neg"></p><button onclick="b3()">تایید و ثبت اسناد بدهکاری</button>`);rc()}
function mtv(){const o={};db.units.forEach(u=>{o[u.id]=bl.md=='n'?1:bl.md=='u'?(parseFloat(nd($('#x'+u.id).value))||0):(u[MK[bl.md]]||0)});o.p=bl.md=='n'?1:(parseFloat(nd($('#xp').value))||0);return o}
function calc(){const o=mtv(),S=Object.values(o).reduce((a,b)=>a+b,0),raw={},sh={},gi={};if(!S)return{o,sh,S,gi};
Object.keys(o).forEach(k=>raw[k]=bl.amt*o[k]/S);if(bl.ug)db.grp.forEach(g=>g.us.forEach(i=>{if(!gi[i])gi[i]=g}));
let adj=0,ru=0;Object.keys(raw).forEach(k=>{if(gi[k]){sh[k]=raw[k]*(1+gi[k].p/100);adj+=sh[k]}else ru+=raw[k]});
Object.keys(raw).forEach(k=>{if(!gi[k])sh[k]=ru?raw[k]*(bl.amt-adj)/ru:0});
if(!ru&&adj)Object.keys(sh).forEach(k=>sh[k]=sh[k]*bl.amt/adj);Object.keys(sh).forEach(k=>sh[k]=Math.round(sh[k]));sh.p=bl.amt-Object.keys(sh).filter(k=>k!='p').reduce((a,k)=>a+sh[k],0);return{o,sh,S,gi}}
function rc(){const c=calc();Object.keys(c.o).forEach(k=>{const el=$('#r'+k);if(el)el.textContent=c.S?money(c.sh[k]):'—'});const z=db.units.filter(u=>!c.o[u.id]).length;$('#rt').textContent=!c.S?'مقادیر هنوز وارد نشده است (در تب واحدها وارد کنید)':z?fa(z)+' واحد مقدار صفر دارد و سهمی نمی‌گیرد':''}
function b3(){const c=calc();if(!c.S)return alert('مقادیر را وارد کنید');const us=[],dt={},sh={};
db.units.forEach(u=>{const s=c.sh[u.id];if(!s)return;us.push(u.id);sh[u.id]=s;const q=fa(c.o[u.id]),S=fa(c.S);
const bas={p:'سهم بر اساس تعداد نفرات: '+q+' نفر از '+S+' نفر',u:'مصرف '+q+' متر مکعب از '+S+' متر مکعب',n:'تقسیم مساوی بین '+fa(db.units.length)+' واحد و بخش عمومی',a:'متراژ واحد '+q+' از مجموع '+S+' متر',h:q+' وسیله گرمایش از '+S+' وسیله'}[bl.md],g=c.gi[u.id];
dt[u.id]=bas+(g?' - گروه '+g.n+' ('+fa(Math.abs(g.p))+'٪ '+(g.p<0?'کمتر':'بیشتر')+')':'')+(bl.t?' - '+bl.t:'')});
if(!confirm('اسناد بدهکاری برای '+fa(us.length)+' واحد ثبت شود؟'))return;
db.exp.push({id:nid(),k:bl.k,amt:bl.amt,ty:BK[bl.k],d:bl.d,t:bl.t,m:bl.m,h:bl.h,sc:'u',us,sh,dt,pub:c.sh.p||0});save();cl();render()}
let pim='';
function pimg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);pim=c.toDataURL('image/jpeg',.6);$('#pv').src=pim;$('#pv').style.display='block';$('#pz').textContent='حجم پس از فشرده‌سازی: '+fa(Math.round(pim.length*.75/1024))+' کیلوبایت'};i.src=r.result};r.readAsDataURL(f)}
function vimg(i){const p=db.pay.find(x=>x.id==i);sheet(`<img src="${p.img}" style="width:100%;border-radius:10px"><button class="s" onclick="delete db.pay.find(x=>x.id==${i}).img;save();cl();render()">حذف تصویر</button>`)}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
